<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FF6B00" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>SHANTHI MAHA GANAPATHI 2026</title>
    <meta name="description" content="Events, registrations, QR passes and live updates for SHANTHI MAHA GANAPATHI 2026." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/pavonix-splash.png" fetchpriority="high" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Great+Vibes&family=Poppins:wght@500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6815609556451528" crossorigin="anonymous"></script>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "def559e2-60c1-4fc0-ba35-9402e4c1b63c",
          allowLocalhostAsSecureOrigin: true,
          serviceWorkerParam: { scope: "/" },
          serviceWorkerPath: "OneSignalSDKWorker.js",
          customlink: {
            enabled: true,
            style: "button",
            size: "medium",
            color: {
              button: "#FF6B00",
              text: "#FFFFFF"
            },
            text: {
              subscribe: "Subscribe to Live Alerts 🔔",
              unsubscribe: "Unsubscribe from Alerts"
            }
          }
        });

        async function syncSubscriberWithOneSignal() {
          try {
            if (OneSignal.User && OneSignal.User.PushSubscription) {
              await OneSignal.User.PushSubscription.optIn().catch(function() {});
            }
            if ("serviceWorker" in navigator && "Notification" in window && Notification.permission === "granted") {
              let reg = await navigator.serviceWorker.getRegistration("/OneSignalSDKWorker.js");
              if (!reg) {
                reg = await navigator.serviceWorker.register("/OneSignalSDKWorker.js", { scope: "/" });
              }
              if (reg && reg.pushManager) {
                const sub = await reg.pushManager.getSubscription();
                if (sub) {
                  const subJson = sub.toJSON();
                  await fetch("https://onesignal.com/api/v1/players", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                      app_id: "def559e2-60c1-4fc0-ba35-9402e4c1b63c",
                      device_type: 5,
                      identifier: subJson.endpoint,
                      web_auth: subJson.keys ? subJson.keys.auth : undefined,
                      web_p256dh: subJson.keys ? subJson.keys.p256dh : undefined,
                    }),
                  }).catch(function() {});
                }
              }
            }
          } catch (e) {}
        }

        if (OneSignal.Notifications) {
          OneSignal.Notifications.addEventListener("permissionChange", function(granted) {
            if (granted) {
              localStorage.setItem("onesignal_prompt_dismissed", "granted");
              syncSubscriberWithOneSignal();
            }
          });

          if (typeof Notification !== "undefined" && Notification.permission === "granted") {
            localStorage.setItem("onesignal_prompt_dismissed", "granted");
            syncSubscriberWithOneSignal();
          }
        }
      });
    </script>
    <style>
      html, body {
        background-color: #000c24 !important;
        color: #ffffff;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow-x: hidden;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
